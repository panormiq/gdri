<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test d'extraction Excel - UGAP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #545b62;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .result-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
        }
        .result-card.success {
            border-color: #28a745;
            background: #f0fff4;
        }
        .result-card.error {
            border-color: #dc3545;
            background: #fff5f5;
        }
        .result-card.warning {
            border-color: #ffc107;
            background: #fffbf0;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .result-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-success {
            background: #28a745;
            color: white;
        }
        .status-error {
            background: #dc3545;
            color: white;
        }
        .status-warning {
            background: #ffc107;
            color: #333;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .colors-section {
            margin-top: 15px;
        }
        .colors-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        .color-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .color-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }
        .color-preview {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .errors-list {
            margin-top: 15px;
            padding: 10px;
            background: #fff5f5;
            border: 1px solid #ffcccc;
            border-radius: 4px;
        }
        .error-item {
            color: #dc3545;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .data-preview {
            margin-top: 15px;
            max-height: 300px;
            overflow: auto;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .data-table th,
        .data-table td {
            padding: 6px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }
        .data-table th {
            background: #f5f5f5;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        .data-table tr:nth-child(even) {
            background: #fafafa;
        }
        .comparison {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .comparison-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }
        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }
        .comparison-table th {
            background: #007bff;
            color: white;
            font-weight: 600;
        }
        .comparison-table tr:nth-child(even) {
            background: #f8f9fa;
        }
        .best-method {
            background: #d4edda !important;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test d'extraction Excel</h1>
        <p class="subtitle">Comparez différentes méthodes d'extraction pour trouver la plus fidèle</p>
        
        <div class="controls">
            <button class="btn btn-primary" id="btn-test">Lancer les tests</button>
            <button class="btn btn-secondary" id="btn-clear">Effacer les résultats</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyse en cours... Cela peut prendre quelques secondes.</p>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const API_BASE = '/api/ugap';
        
        // Récupérer modelId et configId depuis l'URL ou les paramètres
        const urlParams = new URLSearchParams(window.location.search);
        const modelId = urlParams.get('modelId') || localStorage.getItem('ugap_test_modelId');
        const configId = urlParams.get('configId') || localStorage.getItem('ugap_test_configId');

        if (modelId && configId) {
            localStorage.setItem('ugap_test_modelId', modelId);
            localStorage.setItem('ugap_test_configId', configId);
        }

        document.getElementById('btn-test').addEventListener('click', async () => {
            if (!modelId || !configId) {
                alert('Veuillez fournir modelId et configId dans l\'URL (ex: ?modelId=xxx&configId=yyy)');
                return;
            }

            const loadingEl = document.getElementById('loading');
            const resultsEl = document.getElementById('results');
            const btnTest = document.getElementById('btn-test');

            loadingEl.style.display = 'block';
            resultsEl.innerHTML = '';
            btnTest.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/models/${modelId}/configurations/${configId}/test-extraction`, {
                    method: 'GET',
                    credentials: 'include'
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.message || 'Erreur lors des tests');
                }

                displayResults(data.data);
            } catch (error) {
                resultsEl.innerHTML = `
                    <div class="result-card error">
                        <div class="result-header">
                            <div class="result-title">Erreur</div>
                            <span class="result-status status-error">Erreur</span>
                        </div>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                loadingEl.style.display = 'none';
                btnTest.disabled = false;
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            document.getElementById('results').innerHTML = '';
        });

        function displayResults(data) {
            const resultsEl = document.getElementById('results');
            const results = data.results || [];

            let html = `<div style="margin-bottom: 20px; padding: 15px; background: #e7f3ff; border-radius: 6px;">
                <strong>Fichier testé:</strong> ${data.fileName || data.filePath}
            </div>`;

            // Afficher chaque résultat
            results.forEach(result => {
                const cardClass = result.success ? 'success' : (result.available === false ? 'warning' : 'error');
                const statusClass = result.success ? 'status-success' : (result.available === false ? 'status-warning' : 'status-error');
                const statusText = result.success ? 'Succès' : (result.available === false ? 'Non disponible' : 'Erreur');

                html += `
                    <div class="result-card ${cardClass}">
                        <div class="result-header">
                            <div class="result-title">${result.method}</div>
                            <span class="result-status ${statusClass}">${statusText}</span>
                        </div>

                        ${result.stats ? `
                            <div class="stats">
                                ${Object.entries(result.stats).map(([key, value]) => `
                                    <div class="stat-item">
                                        <div class="stat-label">${key}</div>
                                        <div class="stat-value">${value !== null && value !== undefined ? (typeof value === 'object' ? JSON.stringify(value) : value) : 'N/A'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        ${result.debug ? `
                            <div style="margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 4px;">
                                <div class="colors-title">🔍 Informations de debug</div>
                                <details style="margin-top: 8px;">
                                    <summary style="cursor: pointer; font-weight: 600; color: #666;">Afficher les détails</summary>
                                    <pre style="margin-top: 8px; padding: 8px; background: white; border-radius: 4px; font-size: 11px; max-height: 200px; overflow: auto;">${JSON.stringify(result.debug, null, 2)}</pre>
                                </details>
                            </div>
                        ` : ''}

                        ${result.colors && result.colors.length > 0 ? `
                            <div class="colors-section">
                                <div class="colors-title">Couleurs détectées (${result.colors.length})</div>
                                <div class="color-list">
                                    ${result.colors.slice(0, 10).map(color => `
                                        <div class="color-item">
                                            <div class="color-preview" style="background: #${color.color};"></div>
                                            <span>#${color.color}</span>
                                            <span style="color: #666;">(${color.count})</span>
                                        </div>
                                    `).join('')}
                                    ${result.colors.length > 10 ? `<div style="color: #666; font-size: 12px; margin-top: 8px;">... et ${result.colors.length - 10} autres</div>` : ''}
                                </div>
                            </div>
                        ` : result.success ? `
                            <div class="colors-section">
                                <div class="colors-title" style="color: #dc3545;">⚠️ Aucune couleur détectée</div>
                            </div>
                        ` : ''}

                        ${result.errors && result.errors.length > 0 ? `
                            <div class="errors-list">
                                <strong>Erreurs:</strong>
                                ${result.errors.map(err => `<div class="error-item">• ${err}</div>`).join('')}
                            </div>
                        ` : ''}

                        ${result.data && result.data.length > 0 ? `
                            <div class="data-preview">
                                <div class="colors-title">Aperçu des données (${result.data.length} lignes)</div>
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            ${Array.from({ length: Math.min(5, result.data[0]?.length || 0) }, (_, i) => 
                                                `<th>Col ${i + 1}</th>`
                                            ).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${result.data.slice(0, 10).map(row => `
                                            <tr>
                                                ${Array.from({ length: Math.min(5, row?.length || 0) }, (_, i) => 
                                                    `<td>${row[i] !== null && row[i] !== undefined ? String(row[i]).substring(0, 30) : ''}</td>`
                                                ).join('')}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                                ${result.data.length > 10 ? `<div style="margin-top: 10px; color: #666; font-size: 12px;">... et ${result.data.length - 10} lignes supplémentaires</div>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            // Tableau de comparaison
            const successfulResults = results.filter(r => r.success);
            if (successfulResults.length > 1) {
                html += `
                    <div class="comparison">
                        <div class="comparison-title">📊 Comparaison des méthodes</div>
                        <table class="comparison-table">
                            <thead>
                                <tr>
                                    <th>Méthode</th>
                                    <th>Lignes</th>
                                    <th>Couleurs</th>
                                    <th>Styles</th>
                                    <th>Statut</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${successfulResults.map(result => {
                                    const isBest = result.colors && result.colors.length > 0;
                                    return `
                                        <tr ${isBest ? 'class="best-method"' : ''}>
                                            <td>${result.method}</td>
                                            <td>${result.stats?.totalRows || 'N/A'}</td>
                                            <td>${result.colors?.length || 0}</td>
                                            <td>${result.stats?.hasStyles ? 'Oui' : 'Non'}</td>
                                            <td>✅</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            resultsEl.innerHTML = html;
        }

        // Si on a déjà des paramètres, lancer automatiquement les tests
        if (modelId && configId) {
            console.log('Paramètres détectés, lancement automatique des tests...');
            setTimeout(() => {
                document.getElementById('btn-test').click();
            }, 500);
        }
    </script>
</body>
</html>

# ============================================
# Configuration Apache Anti-SYN Flood
# ============================================
# 
# À ajouter dans C:\xampp\apache\conf\httpd.conf
# OU dans C:\xampp\apache\conf\extra\httpd-vhosts.conf (dans chaque VirtualHost)
#
# IMPORTANT : Redémarrer Apache après modification
#
# ============================================

# ============================================
# PROTECTION CONTRE SYN FLOOD
# ============================================

# Activer mod_reqtimeout pour limiter le temps d'établissement des connexions
# Ce module limite le temps qu'une connexion peut rester en état SYN-RECEIVED
<IfModule mod_reqtimeout.c>
    # Timeout pour la réception de la requête complète (header + body)
    # Si le client ne termine pas sa requête dans ce délai, la connexion est fermée
    RequestReadTimeout header=10-40,MinRate=500 body=10,MinRate=500
    
    # Timeout strict pour l'établissement de la connexion (3 secondes)
    # Empêche les connexions qui restent en état SYN-RECEIVED trop longtemps
    RequestReadTimeout handshake=3
</IfModule>

# ============================================
# LIMITATION DES CONNEXIONS SIMULTANÉES
# ============================================

# Limiter le nombre de threads/workers Apache
# Ajustez selon vos besoins (défaut: 25, on limite à 50 pour éviter la surcharge)
<IfModule mpm_winnt.c>
    # Nombre maximum de threads par processus enfant
    ThreadsPerChild 50
    
    # Nombre maximum de requêtes par processus enfant avant recyclage
    MaxConnectionsPerChild 10000
</IfModule>

# Pour les autres MPM (prefork, worker, event)
<IfModule mpm_prefork_module>
    StartServers 5
    MinSpareServers 5
    MaxSpareServers 10
    MaxRequestWorkers 50
    MaxConnectionsPerChild 10000
</IfModule>

<IfModule mpm_worker_module>
    StartServers 3
    MinSpareThreads 25
    MaxSpareThreads 75
    ThreadsPerChild 25
    MaxRequestWorkers 50
    MaxConnectionsPerChild 10000
</IfModule>

<IfModule mpm_event_module>
    StartServers 3
    MinSpareThreads 25
    MaxSpareThreads 75
    ThreadsPerChild 25
    MaxRequestWorkers 50
    MaxConnectionsPerChild 10000
</IfModule>

# ============================================
# TIMEOUTS STRICTS
# ============================================

# Timeout pour l'établissement de la connexion TCP (3 secondes)
# Si le client ne complète pas le handshake dans ce délai, la connexion est fermée
Timeout 3

# Timeout pour la réception des données (5 secondes)
# Si aucune donnée n'est reçue pendant ce délai, la connexion est fermée
KeepAliveTimeout 5

# Nombre maximum de requêtes par connexion Keep-Alive (limité pour éviter l'abus)
MaxKeepAliveRequests 100

# ============================================
# PROTECTION AU NIVEAU DU VIRTUALHOST
# ============================================
# Ajoutez ces directives dans chaque VirtualHost (*:80 et *:443)

# Limiter le nombre de connexions simultanées par IP
# Note: Cette fonctionnalité nécessite mod_limitipconn (non disponible par défaut sur Windows)
# Alternative: Utiliser le rate limiting dans le backend Node.js

# Timeout spécifique pour ce VirtualHost
# <VirtualHost *:443>
#     ...
#     Timeout 3
#     KeepAliveTimeout 5
#     ...
# </VirtualHost>

# ============================================
# LOGGING POUR DÉTECTION D'ATTAQUES
# ============================================

# Format de log personnalisé pour détecter les patterns d'attaque
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D %{X-Forwarded-For}i" syn_flood_format

# Utiliser ce format dans vos VirtualHosts pour analyser les attaques
# CustomLog "logs/syn-flood-access.log" syn_flood_format

# ============================================
# NOTES IMPORTANTES
# ============================================
#
# 1. mod_reqtimeout doit être activé dans httpd.conf :
#    LoadModule reqtimeout_module modules/mod_reqtimeout.so
#
# 2. Les valeurs de timeout sont en secondes
#
# 3. Ajustez MaxRequestWorkers selon votre serveur :
#    - Serveur faible : 25-50
#    - Serveur moyen : 50-100
#    - Serveur puissant : 100-200
#
# 4. Surveillez les logs pour détecter les patterns d'attaque
#
# 5. En cas d'attaque massive, vous pouvez temporairement :
#    - Réduire Timeout à 1 seconde
#    - Réduire MaxRequestWorkers à 25
#    - Bloquer les IPs suspectes via le pare-feu Windows
#
# ============================================



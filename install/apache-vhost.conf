# Configuration Virtual Host pour www.gdri.fr
# Fichier à ajouter dans : C:\xampp\apache\conf\extra\httpd-vhosts.conf
# IMPORTANT : Activer les modules proxy dans httpd.conf :
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so

<VirtualHost *:80>
    ServerName www.gdri.fr
    ServerAlias gdri.fr
    DocumentRoot "C:/xampp/htdocs/gdri"
    
    <Directory "C:/xampp/htdocs/gdri">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Reverse proxy pour les requêtes API vers le backend Node.js
    # TimeOut/ProxyTimeout : génération PDF devis (Puppeteer) sans 502 Apache
    TimeOut 300
    ProxyTimeout 300
    <LocationMatch "^/api/">
        ProxyPass http://127.0.0.1:3000/api/
        ProxyPassReverse http://127.0.0.1:3000/api/
        ProxyPreserveHost On
    </LocationMatch>
    
    # Logs
    ErrorLog "C:/xampp/apache/logs/gdri-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-access.log" common
</VirtualHost>

# Configuration Virtual Host pour HTTPS (si SSL configuré)
<VirtualHost *:443>
    ServerName www.gdri.fr
    ServerAlias gdri.fr
    DocumentRoot "C:/xampp/htdocs/gdri"
    
    # Configuration SSL (à adapter selon votre certificat)
    # SSLEngine on
    # SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/server.crt"
    # SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/server.key"
    
    <Directory "C:/xampp/htdocs/gdri">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Reverse proxy pour les requêtes API vers le backend Node.js
    # TimeOut/ProxyTimeout élevés : génération clip LTX (1-10 min) sans 502 Apache
    TimeOut 900
    ProxyTimeout 900
    <LocationMatch "^/api/">
        ProxyPass http://127.0.0.1:3000/api/
        ProxyPassReverse http://127.0.0.1:3000/api/
        ProxyPreserveHost On
    </LocationMatch>
    
    # Logs
    ErrorLog "C:/xampp/apache/logs/gdri-ssl-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-ssl-access.log" common
</VirtualHost>

# Optionnel : Redirection de gdri.fr vers www.gdri.fr
<VirtualHost *:80>
    ServerName gdri.fr
    Redirect permanent / http://www.gdri.fr/
</VirtualHost>




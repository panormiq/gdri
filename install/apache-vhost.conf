# Configuration Virtual Host pour www.gdri.fr
# Fichier à ajouter dans : C:\xampp\apache\conf\extra\httpd-vhosts.conf

<VirtualHost *:80>
    ServerName www.gdri.fr
    ServerAlias gdri.fr
    DocumentRoot "C:/xampp/htdocs/gdri"
    
    <Directory "C:/xampp/htdocs/gdri">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Logs
    ErrorLog "C:/xampp/apache/logs/gdri-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-access.log" common
</VirtualHost>

# Optionnel : Redirection de gdri.fr vers www.gdri.fr
<VirtualHost *:80>
    ServerName gdri.fr
    Redirect permanent / http://www.gdri.fr/
</VirtualHost>




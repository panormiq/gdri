# VirtualHost environnement DEV/TEST — test.gdri.fr
# À ajouter dans : C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Prérequis DNS :
#   test.gdri.fr  → IP de ton serveur (même que www.gdri.fr)
#
# Prérequis SSL :
#   Le certificat C:/Certbot/live/gdr-innovation.fr doit inclure test.gdri.fr
#   (déjà le cas si renew webroot_map contient test.gdri.fr)
#
# Prérequis backend :
#   Depuis C:\xampp\htdocs\gdri-dev\backend :
#   .\Start-Backend.ps1 -Mode Test   (écoute 127.0.0.1:3001)
#
# DocumentRoot DÉDIÉ : htdocs/gdri-dev (branche develop)
# Prod reste sur htdocs/gdri (branche master)
#
# IMPORTANT : un VirtualHost *:443 dédié est OBLIGATOIRE.
# Sinon HSTS (includeSubDomains sur gdri.fr) force HTTPS et Apache sert
# le mauvais certificat → Firefox bloque sans exception possible.

<VirtualHost *:80>
    ServerName test.gdri.fr
    ServerAlias test.gdr-innovation.fr
    DocumentRoot "C:/xampp/htdocs/gdri-dev"

    <Directory "C:/xampp/htdocs/gdri-dev">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "C:/xampp/htdocs/gdri-dev/.well-known">
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^(.*)$ https://test.gdri.fr/$1 [R=301,L]

    ErrorLog "C:/xampp/apache/logs/gdri-test-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-test-access.log" common
</VirtualHost>

<VirtualHost *:443>
    ServerName test.gdri.fr
    ServerAlias test.gdr-innovation.fr
    DocumentRoot "C:/xampp/htdocs/gdri-dev"

    SSLEngine on
    SSLCertificateFile "C:/Certbot/live/gdr-innovation.fr/fullchain.pem"
    SSLCertificateKeyFile "C:/Certbot/live/gdr-innovation.fr/privkey.pem"
    SSLCertificateChainFile "C:/Certbot/live/gdr-innovation.fr/chain.pem"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    TimeOut 900
    ProxyTimeout 900

    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyPass /api/ http://127.0.0.1:3001/api/
        ProxyPassReverse /api/ http://127.0.0.1:3001/api/

        <IfModule mod_headers.c>
            RequestHeader set X-Forwarded-Proto "https"
            RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
        </IfModule>
    </IfModule>

    <Directory "C:/xampp/htdocs/gdri-dev">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <LimitExcept GET POST PUT DELETE OPTIONS HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    Alias /modules "C:/xampp/htdocs/gdri-dev/modules"
    <Directory "C:/xampp/htdocs/gdri-dev/modules">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <LimitExcept GET POST PUT DELETE OPTIONS HEAD>
            Require all denied
        </LimitExcept>
    </Directory>

    ErrorLog "C:/xampp/apache/logs/gdri-test-ssl-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-test-ssl-access.log" combined
</VirtualHost>

# VirtualHost environnement TEST — test.gdri.fr
# À ajouter dans : C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Prérequis DNS :
#   test.gdri.fr  → IP de ton serveur (même que www.gdri.fr)
#
# Prérequis backend :
#   .\backend\Start-Backend-Test.ps1   (écoute 127.0.0.1:3001)
#
# Même DocumentRoot que la prod : le hostname bascule API + Mongo côté PHP/Node.

<VirtualHost *:80>
    ServerName test.gdri.fr
    ServerAlias test.gdr-innovation.fr
    DocumentRoot "C:/xampp/htdocs/gdri"

    <Directory "C:/xampp/htdocs/gdri">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    TimeOut 300
    ProxyTimeout 300
    # Backend TEST sur le port 3001
    <LocationMatch "^/api/">
        ProxyPass http://127.0.0.1:3001/api/
        ProxyPassReverse http://127.0.0.1:3001/api/
        ProxyPreserveHost On
    </LocationMatch>

    ErrorLog "C:/xampp/apache/logs/gdri-test-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-test-access.log" common
</VirtualHost>

<VirtualHost *:443>
    ServerName test.gdri.fr
    ServerAlias test.gdr-innovation.fr
    DocumentRoot "C:/xampp/htdocs/gdri"

    # Réutiliser / adapter le certificat (wildcard *.gdri.fr idéal, sinon certificat dédié)
    # SSLEngine on
    # SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/server.crt"
    # SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/server.key"

    <Directory "C:/xampp/htdocs/gdri">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    TimeOut 900
    ProxyTimeout 900
    <LocationMatch "^/api/">
        ProxyPass http://127.0.0.1:3001/api/
        ProxyPassReverse http://127.0.0.1:3001/api/
        ProxyPreserveHost On
    </LocationMatch>

    ErrorLog "C:/xampp/apache/logs/gdri-test-ssl-error.log"
    CustomLog "C:/xampp/apache/logs/gdri-test-ssl-access.log" common
</VirtualHost>
